# ASP.NET Core

trigger:
- master

jobs:
- job: Test
  timeoutInMinutes: 0
  pool:
    vmImage: 'windows-latest'

  steps:

# TEST
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: 10.x

  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: 'build'
      projects: '**/*.csproj'


  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: 'test'
      projects: '**/*[Tt]ests/*.csproj'
      arguments: '--logger trx'

  - task: PowerShell@2
    displayName: Summarize test failures
    condition: always()
    inputs:
      targetType: 'filePath'
      filePath: 'build/summarize-trx.ps1'
      arguments: '-SearchRoot $(Agent.TempDirectory) -OutPath $(Build.ArtifactStagingDirectory)/test-failures-summary.txt'
      pwsh: false

  - task: ArchiveFiles@2
    condition: always()
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)/SilveR.IntegrationTests/bin/Debug/net10.0/ActualResults/*'
      archiveFile: '$(Build.ArtifactStagingDirectory)/Test-Results.zip'


# BUILD LITE VERSION
  - script: 'dotnet clean'
    displayName: Clean Build
    condition: always()

  - task: DotNetCoreCLI@2
    displayName: dotnet publish
    condition: always()
    inputs:
      command: 'publish'
      arguments: '--output $(Build.ArtifactStagingDirectory) -r win-x64'
      zipAfterPublish: true

  - task: CopyFiles@2
    condition: always()
    inputs:
      contents: '*.zip'
      targetFolder: '$(Build.ArtifactStagingDirectory)/'

  - task: CmdLine@2
    condition: always()
    inputs:
      script: 'ren $(Build.ArtifactStagingDirectory)\SilveR.zip InVivoStat-win-x64-test-only.zip'

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      ArtifactName: 'drop'

  - task: GitHubRelease@1
    condition: always()
    inputs:
      gitHubConnection: github
      repositoryName: robalexclark/SilveR
      action: edit
      target: 'master'
      tagSource: manual
      tag: '5.2.0'
      title: '5.2.0'
      assetUploadMode: 'replace'
      assets: '$(Build.ArtifactStagingDirectory)/InVivoStat-win-x64-test-only.zip'
      isPreRelease: true
      isDraft: false
      
      

- job: Windows
  # Removed dependsOn so Windows can start immediately
  condition: always()
  pool:
    vmImage: 'windows-latest'

  steps:

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: 6.x

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: 10.x

  - task: NodeTool@0
    inputs:
      versionSpec: '16.x'

  - script: dotnet tool install ElectronNET.CLI -g
    displayName: Install Electron.Net CLI

  - script: 'dotnet clean'
    displayName: Clean Build

  - powershell: |
      electronize build /target win /package-json electron-builder.package.json
      if ($LASTEXITCODE -ne 0) {
          throw "electronize build failed with exit code $LASTEXITCODE."
      }
      $installer = $null
      $deadline = (Get-Date).AddMinutes(30)
      while (($null -eq $installer) -and ((Get-Date) -lt $deadline)) {
          $installer = Get-ChildItem -Path '$(Agent.WorkFolder)' -Filter '*.exe' -File -Recurse |
              Where-Object { $_.Name -like '*Setup*.exe' -and $_.Name -notlike '*uninstaller*' } |
              Select-Object -First 1
          if ($null -eq $installer) {
              Write-Host 'Waiting for electron-builder to produce the Windows installer...'
              Start-Sleep -Seconds 10
          }
      }
      if ($null -eq $installer) {
          throw 'electron-builder did not produce the Windows installer within 30 minutes.'
      }
      Write-Host "Copying installer from $($installer.FullName)"
      Copy-Item -LiteralPath $installer.FullName -Destination '$(Build.ArtifactStagingDirectory)/InVivoStat Setup 5.2.0.exe' -Force
    workingDirectory: ./SilveR
    displayName: Build and copy InVivoStat Setup 5.2.0.exe

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/InVivoStat Setup 5.2.0.exe'
      ArtifactName: 'drop'

  - task: GitHubRelease@1
    inputs:
      gitHubConnection: github
      repositoryName: robalexclark/SilveR
      action: edit
      target: 'master'
      tagSource: manual
      tag: '5.2.0'
      title: '5.2.0'
      assetUploadMode: 'replace'
      assets: '$(Build.ArtifactStagingDirectory)/InVivoStat Setup 5.2.0.exe'
      isPreRelease: true
      isDraft: false



- job: Linux
  condition: always()
  pool:
    vmImage: 'ubuntu-latest'

  steps:

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: 6.x

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: 10.x

  - task: NodeTool@0
    inputs:
      versionSpec: '16.x'

  - script: dotnet tool install ElectronNET.CLI -g
    displayName: Install Electron.Net CLI

  - script: |
      electronize build /target linux /package-json electron-builder.package.json
      installer=''
      for attempt in $(seq 1 180); do
        installer="$(find "$(Agent.WorkFolder)" -type f -name '*.AppImage' -print -quit)"
        test -n "$installer" && break
        echo 'Waiting for electron-builder to produce the Linux AppImage...'
        sleep 10
      done
      test -n "$installer" || { echo 'electron-builder did not produce the Linux AppImage within 30 minutes.' >&2; exit 1; }
      echo "Copying installer from $installer"
      cp "$installer" "$(Build.ArtifactStagingDirectory)/InVivoStat Setup 5.2.0.AppImage"
    workingDirectory: ./SilveR
    displayName: Build and copy InVivoStat Setup 5.2.0.AppImage

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/InVivoStat Setup 5.2.0.AppImage'
      ArtifactName: 'drop'

  - task: GitHubRelease@1
    inputs:
      gitHubConnection: github
      repositoryName: robalexclark/SilveR
      action: edit
      target: 'master'
      tagSource: manual
      tag: '5.2.0'
      title: '5.2.0'
      assetUploadMode: 'replace'
      assets: '$(Build.ArtifactStagingDirectory)/InVivoStat Setup 5.2.0.AppImage'
      isPreRelease: true
      isDraft: false



